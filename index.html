<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GBTI 游戏摆烂人格测试</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <div class="app-shell">
    <section id="intro" class="screen active">
      <div class="hero">
        <div class="eyebrow">GBTI · GAMER PERSONALITY TEST</div>
        <h1>你到底是什么<br />游戏怪东西？</h1>
        <p class="sub">30 道不太正经的题，把你拆成 FPS、MOBA、单机和休闲四类抽象队友。仅供娱乐，别拿去排位复盘。</p>
        <div class="hero-actions">
          <button id="startBtn" class="btn-primary">开始测试</button>
        </div>
      </div>
    </section>

    <section id="test" class="screen">
      <div class="test-wrap panel">
        <div class="topbar">
          <div class="progress"><span id="progressBar"></span></div>
          <div class="progress-text" id="progressText">0 / 0</div>
        </div>
        <div id="questionList" class="question-list"></div>
        <div class="test-footer">
          <p id="testHint" class="hint">全部答完才会放行。</p>
          <div class="test-actions">
            <button id="prevBtn" class="btn-secondary" type="button">我选错了</button>
            <button id="submitBtn" class="btn-primary" disabled>提交审判</button>
          </div>
        </div>
      </div>
    </section>

    <section id="result" class="screen">
      <div class="result-wrap panel">
        <div class="result-kicker" id="resultKicker"></div>
        <h2 id="resultTypeName"></h2>
        <div class="badge" id="resultBadge"></div>
        <div class="result-grid">
          <div class="poster-box" id="posterBox"><img id="posterImage" alt="" /></div>
          <div class="result-copy">
            <p class="result-sub" id="resultSub"></p>
            <p class="result-desc" id="resultDesc"></p>
          </div>
        </div>
        <h3 class="dim-title">你的游戏属性</h3>
        <div id="dimList" class="dim-list"></div>
        <p id="funNote" class="fun-note"></p>
        <div class="result-actions">
          <button id="shotBtn" class="btn-secondary" type="button">截图</button>
          <button id="copyBtn" class="btn-secondary">复制结果文字</button>
          <button id="restartBtn" class="btn-primary">再测一次</button>
        </div>
      </div>
    </section>
  </div>

  <script src="data/dimensions.js"></script>
  <script src="data/types.js"></script>
  <script src="data/questions.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/html2canvas.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
